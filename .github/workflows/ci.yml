name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test Suite & CI Gate Simulation
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install pytest pytest-asyncio httpx

      - name: Run Pytest Suite
        run: |
          pytest -v

      - name: Verify CLI Guardrail Inspection
        run: |
          evalforge guard check "Contact support at help@evalforge.dev or call 800-555-0199."

      - name: Run Benchmark Evaluation & CI Gate
        run: |
          evalforge run --dataset examples/benchmarks/qa_benchmark.json --name "ci_baseline" --output "ci_base.json"
          evalforge run --dataset examples/benchmarks/qa_benchmark.json --name "ci_candidate" --output "ci_cand.json"
          evalforge gate --baseline ci_base.json --candidate ci_cand.json --alpha 0.05 --threshold 0.02 --markdown pr_gate_report.md
          cat pr_gate_report.md
